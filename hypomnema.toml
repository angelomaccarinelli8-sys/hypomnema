# Impostazioni di Hypomnema.
# I percorsi relativi partono dalla cartella che contiene questo file.

[quaderno]
# Cartella dove vivono le note e il registro.
# Puoi mettere un percorso assoluto, per esempio "C:/Users/nome/Documenti/quaderno".
cartella = "quaderno"

# Sottocartella del quaderno con una nota per file.
cartella_note = "note"

# File del registro degli ingressi (si allunga soltanto).
file_registro = "registro.md"

# Quante cifre usare per il numero delle note (4 => 0001, 0002, ...).
cifre_numero_nota = 4

[testimone]
# Il testimone registra le parole esatte di ogni tuo messaggio a Claude, con data e ora,
# in un file dentro la cartella del quaderno. Serve allo sportello per controllare che
# una nota con autore "utente" riporti parole che hai detto davvero.
# Spento di base: scrivi true per accenderlo, false per spegnerlo.
# Da spento, le note con autore "utente" vengono salvate come "autore non verificato".
attivo = false

# File del testimone, dentro la cartella del quaderno (si allunga soltanto).
file = "testimone.jsonl"

# I messaggi che iniziano con questo prefisso non vengono registrati:
# il testimone annota solo data e ora con "messaggio privato, non registrato".
prefisso_privato = "#privato"
