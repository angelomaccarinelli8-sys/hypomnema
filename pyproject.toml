[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypomnema"
version = "0.7.0"
description = "Memoria permanente per Claude in file Markdown: Claude propone le note, i programmi decidono se entrano."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Angelo Maccarinelli" }]
dependencies = []

[project.scripts]
hypomnema = "hypomnema.cli:main"

[tool.setuptools]
packages = ["hypomnema", "hypomnema._tomli"]

[tool.setuptools.package-data]
hypomnema = ["_cldr/*"]
