# Hypomnema: la lista delle etichette (dalla versione 0.7.0). MODELLO da copiare.
#
# Copia questo file nella cartella del quaderno (accanto a registro.md e alla cartella note), con il
# nome etichette.toml, e scrivi le TUE etichette al posto di quelle di esempio, che sono inventate.
# Lo leggono tutte e due le configurazioni dello stesso quaderno (Claude Code e la chat): una lista sola.
#
# - chi: le persone. Si propongono solo a mano (al massimo 2 per nota): lo sportello non le cerca.
# - cosa: i progetti o gli argomenti. Dalla 0.8.0 lo SPORTELLO le trova da solo nel testo della nota
#   (parola intera, maiuscole e minuscole indifferenti: "orto" trova «l'Orto», non «ortografia») e le
#   aggiunge, senza limite di numero. Si possono anche proporre a mano (al massimo 2 per nota).
#   Scegli parole che nel testo vogliono dire solo quella cosa: "gioco" si trova anche in «è in gioco».
# - Liste corte e fisse: ogni etichetta tra virgolette, su una riga, senza virgole, senza doppioni.
# - Nelle proposte a mano il confronto è esatto: "Orto" e "orto" sono due etichette diverse.
# - Se questo file manca dal quaderno, nessuna nota può avere etichette.
# - Lo scrivi tu: Claude non lo scrive mai. Può proporti la lista nel suo messaggio, e tu la salvi qui.
# - Togliere un'etichetta dalla lista non cambia le note che la hanno già (labels le mostra a parte).

# - Dalla 0.10.0 una COSA può avere dei SOTTO-RAMI (gli argomenti), in una tabella [rami.<cosa>] qui sotto:
#   una riga per sotto-ramo, con le parole che lo fanno riconoscere nel testo (parola intera, come le COSA).
#   Conta solo la lista di parole, non il nome. Una nota prende un sotto-ramo solo se ha già la COSA del ramo.
#   Senza tabelle [rami.…] tutto funziona come prima. `tree` mostra l'albero e le note «senza argomento».
#   Due idee dello stesso autore nello stesso sotto-ramo non stanno in due note: la seconda si integra
#   nella prima (lo sportello lo dice). Se sono davvero idee diverse, serve un sotto-ramo più preciso.

chi = ["Anna", "Marco"]
cosa = ["orto", "bilancio", "gioco"]

[rami.orto]
pomodori = ["pomodori", "pomodoro"]
irrigazione = ["irrigazione", "goccia", "annaffiare"]
